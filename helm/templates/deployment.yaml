{{- $auditSidecarEnabled := eq (lower (toString .Values.auditSidecar.enabled)) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mrms-backend.fullname" . }}
  labels: {{- include "mrms-backend.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "mrms-backend.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app: {{ include "mrms-backend.fullname" . }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.pullSecret }}
      {{- if .Values.affinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: DoesNotExist
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:    
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP      
          {{- range $key, $val := .Values.env }}
          {{- if not (and (hasPrefix "AUDIT_" $key) (not $auditSidecarEnabled)) }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          {{- end }}
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecretName | default (printf "%s-secret" (include "mrms-backend.fullname" .)) | quote }}
          ports:
            - containerPort: 3000
              protocol: TCP
          # TODO: add healthchecks to the service if need.
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if $auditSidecarEnabled }}
        {{- $auditSidecarRepository := default (regexReplaceAll "/[^/]+$" .Values.image.repository (printf "/%s" .Values.auditSidecar.name)) .Values.auditSidecar.image.repository }}
        - name: {{ .Values.auditSidecar.name }}
          {{- if .Values.auditSidecar.image.digest }}
          image: "{{ $auditSidecarRepository }}:{{ .Values.auditSidecar.image.tag }}@{{ .Values.auditSidecar.image.digest }}"
          {{- else }}
          image: "{{ $auditSidecarRepository }}:{{ .Values.auditSidecar.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.auditSidecar.image.pullPolicy }}
          {{- with .Values.auditSidecar.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.auditSidecar.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.auditSidecar.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.auditSidecar.env .Values.auditSidecar.extraEnv }}
          env:
          {{- range $key, $val := .Values.auditSidecar.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
          {{- end }}
          {{- with .Values.auditSidecar.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.auditSidecar.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.auditSidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if or .Values.extraVolumes (and $auditSidecarEnabled .Values.auditSidecar.volumes) }}
      volumes:
        {{- if and $auditSidecarEnabled .Values.auditSidecar.volumes }}
          {{- toYaml .Values.auditSidecar.volumes | nindent 8 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
