# Default values for mrms-backend.

pullSecret: ci-dos
envFromSecretName: ""

replicaCount: 1

image:
  repository: nexus-ci.corp.dev.vtb/sumd-docker-lib/mrms-backend
  tag: v1.0.0
  pullPolicy: Always

auditSidecar:
  enabled: false
  name: audit-proxy
  image:
    repository: ""
    tag: v1.0.2
    pullPolicy: Always
  ports: []
  readinessProbe:
    tcpSocket:
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    tcpSocket:
      port: 8081
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  env:
    SPRING_PROFILES_ACTIVE: dev
    KAFKA_BOOTSTRAP_SERVERS: omni1-emulator-kafka:9092
    MS_PROPERTIES_INFO_SYSTEM_CODE: SUMD
    MS_PROPERTIES_INFO_SYSTEM_ID: "1661"
  extraEnv: []
  volumeMounts: []
  volumes: []
  resources: {}

extraEnv: []
extraVolumes: []

auditCertificate:
  enabled: false
  name: mrms-backend-audit-kafka-client-tls
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-4"
  keySize: 2048
  mergeTrustChain: false
  mergeTrustChainMode: WithFormattingAppendOnly
  certificateSecret: mrms-backend-audit-kafka-client-tls
  passwordSecret: mrms-backend-audit-kafka-passwords
  passwordKey: KAFKA_KEYSTORE_PASSWORD
  trustPasswordKey: KAFKA_TRUSTSTORE_PASSWORD
  keyFile: kafka-keystore.p12
  trustChainFile: kafka-truststore.p12
  risCode: SUMD
  risId: "1661"
  apdCode: ""
  appName: ""
  dn: ""
  renew: true
  mutableSecret: false
  rotation: 2200h
  watchSecret: false
  reloadDeployment: true
  deployment: ""
  workflow: createKeyPairAndSendCertificateSigningRequest
  hosts: []
  extKeyUsages: []

resources:
  requests:
    cpu: "300m"
    memory: "1000Mi"
  limits:
    cpu: "600m"
    memory: "2000Mi"

secretName: ingress-tls

ingress:
  enabled: true
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: mrms-backend-ds1-lpad01-sumd-team-sumcore-system.apps.ds1-lpad01.corp.dev.vtb
      paths:
        - pathType: ImplementationSpecific
          backend:
            service:
              name: mrms-backend
              port:
                number: 3000
  tls:
    - secretName: ingress-tls
      hosts:
        - mrms-backend-ds1-lpad01-sumd-team-sumcore-system.apps.ds1-lpad01.corp.dev.vtb


###Выбор worker ноды без GPU
affinity:
  enabled: false
#  nodeAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      nodeSelectorTerms:
#        - matchExpressions:
#            - key: nvidia.com/gpu.product
#              operator: DoesNotExist

### Выбор политики для автоскалирования количества подов - разкомментить требуемое
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  # targetCPUUtilizationPercentage: 80
  # targetCPUAverageValue: 100m
  # targetMemoryUtilizationPercentage: 80
  # targetMemoryAverageValue: 200Mi

secrets:
  immutable:
    enabled: true

env:
 SUM_PG_CONNECTION_NAME: sum
 SUM_PG_HOST: d5sumd-pgc001lk.corp.dev.vtb
 SUM_PG_PORT: 5432
 SUM_PG_SCHEMA: postgres
 RM_PG_CONNECTION_NAME: rm
 RM_PG_HOST: d5sumd-pgc001lk.corp.dev.vtb
 RM_PG_PORT: 5432
 RM_PG_SCHEMA: mrms_db

secret:
 SUM_PG_USER: "sum_user"
 SUM_PG_PASSWORD: "sum_user_pass"
 RM_PG_USER: "rm_user"
 RM_PG_PASSWORD: "rm_user_pass"
 BPMN_USER: demo
 BPMN_PWD: demo
